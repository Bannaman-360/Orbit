# Checks every push. Releases: Run workflow on main (Actions → Installers) reads the version from
# apps/desktop/package.json, tags main with it, builds the Windows installers and publishes the
# release with them (a version tag does the same).
# The Mac half is built on a Mac with scripts/release-mac.sh, which adds the .dmgs, the zipped apps
# and checksums-mac.txt to the same release: GitHub's Mac machines often never start the job.
# (Tick "Also try the Mac build on GitHub" to try it here anyway; its files are only kept as a
# download on the run, not added to the release.)
# Publishing is what sends the update to everyone's app. Each computer's app waits until its own
# half is in the release. Both builds are unsigned for now (see apps/desktop/electron-builder.yml).
name: Installers
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      mac_on_github:
        description: Also try the Mac build on GitHub (it often never starts; scripts/release-mac.sh is the usual way)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: The tag matches the app's version (or the update would be offered forever)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$v" ]; then echo "Tag $GITHUB_REF_NAME doesn't match version $v in apps/desktop/package.json"; exit 1; fi
      - name: This version hasn't been released yet (Run workflow on main makes a release)
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: |
          v="$(node -p "require('./apps/desktop/package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then echo "v$v already exists: raise the version in apps/desktop/package.json (and CHANGELOG.md) first"; exit 1; fi
      - run: pnpm typecheck
      - run: pnpm test

  mac:
    needs: checks
    if: github.event_name == 'workflow_dispatch' && inputs.mac_on_github
    timeout-minutes: 45
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: ffmpeg (LGPL, built from the official source)
        run: |
          mkdir -p build-deps/ffmpeg-dl
          curl -fsSL -o build-deps/ffmpeg-dl/ffmpeg-7.1.1.tar.xz https://ffmpeg.org/releases/ffmpeg-7.1.1.tar.xz
          echo "733984395e0dbbe5c046abda2dc49a5544e7e0e1e2366bba849222ae9e3a03b1  build-deps/ffmpeg-dl/ffmpeg-7.1.1.tar.xz" | shasum -a 256 -c
          scripts/build-ffmpeg-mac.sh
      - run: pnpm --filter action-cam-editor dist:mac
      - name: Smoke launch (no GPU on these machines, so a failure here is only reported)
        continue-on-error: true
        run: |
          app="$(ls -d apps/desktop/release/mac-arm64/*.app | head -1)"
          perl -e 'alarm 120; exec @ARGV' "$app/Contents/MacOS/Action Cam Editor" --selftest --selftest-mode=startup || true
          cat "$TMPDIR/ace-selftest-out/report.json"
      - name: Zipped apps (what installed copies update from)
        run: |
          v="$(node -p "require('./apps/desktop/package.json').version")"
          cd apps/desktop/release
          ditto -c -k --sequesterRsrc --keepParent "mac-arm64/Action Cam Editor.app" "Action-Cam-Editor-$v-mac-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent "mac/Action Cam Editor.app" "Action-Cam-Editor-$v-mac-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip

  windows:
    needs: checks
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: ffmpeg (LGPL build from FFmpeg-Builds, pinned and checked; uses the graphics chip's encoders for 10-bit)
        shell: pwsh
        run: |
          $u = "https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/autobuild-2026-07-31-14-10/ffmpeg-n7.1.5-12-g1fdbca85aa-win64-lgpl-7.1.zip"
          Invoke-WebRequest $u -OutFile ffmpeg.zip
          $h = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLower()
          if ($h -ne "b7c1c846dacca68ee4ebf5c390742c973b3d5d14a6d44b061f500d8e4ac74fc0") { throw "ffmpeg download doesn't match its checksum ($h)" }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-x
          $d = "apps/desktop/resources/ffmpeg"; New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item (Get-ChildItem ffmpeg-x -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName $d
          Copy-Item (Get-ChildItem ffmpeg-x -Recurse -Filter LICENSE.txt | Select-Object -First 1).FullName "$d/LICENSE-ffmpeg.txt"
          "LGPL build of FFmpeg n7.1.5 by FFmpeg-Builds (autobuild-2026-07-31-14-10). Source: https://github.com/FFmpeg/FFmpeg/tree/n7.1.5" | Out-File "$d/README.txt"
      - run: pnpm --filter action-cam-editor dist:win
      - name: Smoke launch (no GPU on these machines, so a failure here is only reported)
        continue-on-error: true
        shell: pwsh
        run: |
          $p = Start-Process "apps/desktop/release/win-unpacked/Action Cam Editor.exe" -ArgumentList "--selftest","--selftest-mode=startup" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill() }
          Get-Content "$env:TEMP/ace-selftest-out/report.json"
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: apps/desktop/release/*.exe }

  release:
    needs: [windows]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: windows, path: dist/windows }
      - name: Version
        id: version
        run: |
          v="$(node -p "require('./apps/desktop/package.json').version")"
          echo "v=$v" >> "$GITHUB_OUTPUT"
      - name: Tag main with the version (Run workflow; a tag pushed here doesn't start another build)
        if: github.event_name == 'workflow_dispatch'
        run: |
          t="v${{ steps.version.outputs.v }}"
          # (Already there if the Mac half was added first.)
          if git ls-remote --exit-code --tags origin "refs/tags/$t" >/dev/null; then echo "$t already exists"; exit 0; fi
          git tag "$t"
          git push origin "$t"
      - name: Release notes (this version's part of CHANGELOG.md)
        run: |
          v="${{ steps.version.outputs.v }}"
          awk -v v="$v" '/^## /{on = index($0, v) > 0; next} on' CHANGELOG.md > notes.md
          cat docs/BETA.md >> notes.md
      - name: Checksums (the Windows app checks each update against these)
        run: cd dist && sha512sum windows/* > checksums-windows.txt && cat checksums-windows.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.v }}
          name: Action Cam Editor ${{ steps.version.outputs.v }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.v, '-') }}
          body_path: notes.md
          files: |
            dist/windows/*.exe
            dist/checksums-windows.txt
