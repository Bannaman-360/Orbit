<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb21a"/>
      <stop offset="0.55" stop-color="#ff6a2b"/>
      <stop offset="1" stop-color="#ff2d62"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.42" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#3a4250"/>
      <stop offset="0.6" stop-color="#151a22"/>
      <stop offset="1" stop-color="#07090c"/>
    </radialGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#5a0d1c" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824 px rounded square centred on the 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shine)"/>
  <!-- a 360 orbit around the lens -->
  <ellipse cx="512" cy="530" rx="330" ry="118" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="22" transform="rotate(-18 512 530)"/>
  <!-- the lens -->
  <g filter="url(#drop)">
    <circle cx="512" cy="512" r="232" fill="#fff"/>
    <circle cx="512" cy="512" r="200" fill="url(#lens)"/>
  </g>
  <!-- speedometer arc in the lens -->
  <path d="M 380 590 A 150 150 0 1 1 644 590" fill="none" stroke="#2c3440" stroke-width="30" stroke-linecap="round"/>
  <path d="M 380 590 A 150 150 0 0 1 586 384" fill="none" stroke="#ffb21a" stroke-width="30" stroke-linecap="round"/>
  <line x1="512" y1="512" x2="604" y2="420" stroke="#fff" stroke-width="22" stroke-linecap="round"/>
  <circle cx="512" cy="512" r="26" fill="#fff"/>
  <circle cx="452" cy="440" r="26" fill="#fff" fill-opacity="0.22"/>
  <!-- front of the orbit passes over the lens -->
  <path d="M 196 616 A 330 118 -18 0 0 828 412" fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round" transform="rotate(0)"/>
</svg>
